<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cabin – Campus Identity Sign-in</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body class="login-body">
  <div class="login-card-container">
    <div class="login-brand-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
      </svg>
    </div>

    <h2>Smart Cabin Portal</h2>
    <p class="login-subtitle">Campus Real-Time Availability & Context Network</p>

    <!-- Role Switcher -->
    <div class="role-tabs" id="roleTabs" role="tablist">
      <button type="button" class="role-tab active" data-role="student" role="tab" aria-selected="true" id="tabStudent">
        Student / Visitor
      </button>
      <button type="button" class="role-tab" data-role="hod" role="tab" aria-selected="false" id="tabHOD">
        Faculty / HOD
      </button>
    </div>

    <!-- SSO Buttons -->
    <div class="sso-buttons-group">
      <!-- Google Sign In -->
      <button type="button" class="btn-sso btn-google" id="btnGoogleLogin">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>

      <!-- Microsoft Sign In -->
      <button type="button" class="btn-sso btn-microsoft" id="btnMicrosoftLogin">
        <svg viewBox="0 0 23 23">
          <path fill="#f35325" d="M1 1h10v10H1z"/>
          <path fill="#81bc06" d="M12 1h10v10H12z"/>
          <path fill="#05a6f0" d="M1 12h10v10H1z"/>
          <path fill="#ffba08" d="M12 12h10v10H12z"/>
        </svg>
        Sign in with Microsoft
      </button>
    </div>

    <div style="margin: 1.25rem 0; display: flex; align-items: center; gap: 0.75rem; color: var(--text-muted); font-size: 0.8rem;">
      <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
      <span>OR</span>
      <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
    </div>

    <a href="/index.html" class="nav-link" style="justify-content: center; width: 100%; padding: 0.75rem; border-radius: var(--radius-sm); font-weight: 600;">
      Continue as Guest Visitor
    </a>

    <p class="login-footer-info" style="margin-top: 1.75rem;">
      Protected by Institutional SSO & Dual-Factor Campus Auth.<br>
      Department of Data Science & Computing Systems.
    </p>
  </div>

  <script>
    let activeRole = 'student';

    const tabStudent = document.getElementById('tabStudent');
    const tabHOD = document.getElementById('tabHOD');
    const btnGoogle = document.getElementById('btnGoogleLogin');
    const btnMicrosoft = document.getElementById('btnMicrosoftLogin');

    tabStudent.addEventListener('click', () => {
      activeRole = 'student';
      tabStudent.classList.add('active');
      tabHOD.classList.remove('active');
      tabStudent.setAttribute('aria-selected', 'true');
      tabHOD.setAttribute('aria-selected', 'false');
    });

    tabHOD.addEventListener('click', () => {
      activeRole = 'hod';
      tabHOD.classList.add('active');
      tabStudent.classList.remove('active');
      tabHOD.setAttribute('aria-selected', 'true');
      tabStudent.setAttribute('aria-selected', 'false');
    });

    function performLogin(provider) {
      const userProfile = {
        role: activeRole,
        provider: provider,
        name: activeRole === 'hod' ? 'Dr. Supervisor Name' : 'Campus Student',
        email: activeRole === 'hod' ? 'hod.datascience@campus.edu' : 'student@campus.edu',
        signedInAt: new Date().toISOString()
      };

      localStorage.setItem('smart_cabin_auth', JSON.stringify(userProfile));

      // Visual feedback
      const btn = provider === 'Google' ? btnGoogle : btnMicrosoft;
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span style="display:inline-block;animation:spin 1s linear infinite;">⏳</span> Authorizing ${provider}...`;
      btn.disabled = true;

      setTimeout(() => {
        if (activeRole === 'hod') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/index.html';
        }
      }, 600);
    }

    btnGoogle.addEventListener('click', () => performLogin('Google'));
    btnMicrosoft.addEventListener('click', () => performLogin('Microsoft'));
  </script>
</body>
</html>
